<ul class="toc__list">
  {% for item in items %}
    <li class="toc__item{% if not item.is_unit %} toc__item--section{% endif %}">
      {% if item.is_unit %}
        <a
          class="toc__link{% if item.current %} toc__link--current{% endif %}"
          href="{{ item.url }}"
          lang="{{ item.label.lang }}"
          {% if item.current %}aria-current="page"{% endif %}
        >
          {{ item.label }}
        </a>
        {% if not item.translated %}
          <span class="toc__pending">
            перевод готовится
          </span>
        {% endif %}
      {% else %}
        <span
          class="toc__section"
          lang="{{ item.label.lang }}"
        >
          {{ item.label }}
        </span>
        {% include 'site/parts/toc_items.html' with items=item.children %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
