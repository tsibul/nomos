<div class="act-head">
  {% if act_head_current %}
    <span class="act-head__label">
      {{ label }}
    </span>
  {% else %}
    <a
      class="act-head__label"
      href="{{ act_url }}"
    >
      {{ label }}
    </a>
  {% endif %}
  {% if title %}
    <span
      class="act-head__title"
      lang="{{ title_lang }}"
    >
      {{ title }}
    </span>
  {% endif %}
</div>
