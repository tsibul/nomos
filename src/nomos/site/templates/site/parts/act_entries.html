<ul class="acts__list">
  {% for entry in entries %}
    <li class="acts__item">
      <a
        class="acts__link"
        href="{{ entry.url }}"
      >
        <span class="acts__label">
          {{ entry.label }}
        </span>
        {% if entry.title %}
          <span class="acts__title">
            {{ entry.title }}
          </span>
        {% endif %}
      </a>
    </li>
  {% empty %}
    <li class="acts__item acts__item--empty">
      Нет актов
    </li>
  {% endfor %}
</ul>
