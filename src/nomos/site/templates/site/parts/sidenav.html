{# Оглавление открытого акта: на телефоне — шторка над текстом, на широком — колонка #}
<aside
  class="sidenav{% if sidenav_wide_only %} sidenav--wide-only{% endif %}"
  aria-label="{{ sidenav_title }}"
  data-sidenav
>
  <details class="sidenav__details">
    <summary class="sidenav__summary">
      {{ sidenav_title }}
    </summary>

    <div class="sidenav__body">
      {% if section_url %}
        <a
          class="sidenav__back"
          href="{{ section_url }}"
        >
          ← {{ section_label }}
        </a>
      {% endif %}

      {% include 'site/parts/toc_items.html' with items=nav_toc %}
    </div>
  </details>
</aside>
