{% load django_vite %}
<!doctype html>
<html
  lang="ru"
  translate="no"
>
  <head>
    <meta charset="utf-8">
    <meta
      name="google"
      content="notranslate"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>
      {% block title %}Nomos{% endblock %}
    </title>
    {% vite_hmr_client %}
    {% vite_asset 'js/main.js' %}
  </head>

  <body class="page">
    <header class="page__header">
      <div class="page__bar">
        <a
          class="page__brand"
          href="/"
        >
          Nomos
        </a>
        {# место под главное меню #}
      </div>
      {% block header %}{% endblock %}
    </header>

    <main class="page__main">
      {% block main %}{% endblock %}
    </main>
  </body>
</html>
