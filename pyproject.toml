[project]
name = "nomos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-vite>=3.2.0",
    "mysqlclient>=2.3.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nomos"]
